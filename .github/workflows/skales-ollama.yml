name: Temporary Ollama Brain for Skales

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skales-ollama-session
  cancel-in-progress: true

jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Check required secret
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          if [ -z "$OLLAMA_API_KEY" ] || [ "${#OLLAMA_API_KEY}" -lt 32 ]; then
            echo "::error::Add a repository Actions secret named OLLAMA_API_KEY with at least 32 random characters."
            exit 1
          fi

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$HOME/.ollama"
          OLLAMA_HOST=127.0.0.1:11434 ollama serve >/tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null || {
            cat /tmp/ollama.log
            echo "::error::Ollama did not start."
            exit 1
          }
          OLLAMA_HOST=127.0.0.1:11434 ollama pull llama3.2:1b

      - name: Start authenticated OpenAI-compatible gateway
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          nohup python3 .github/scripts/ollama_proxy.py >/tmp/ollama-proxy.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8000/v1/models; then
              break
            fi
            sleep 1
          done
          if ! curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/v1/models | grep -q '^401$'; then
            cat /tmp/ollama-proxy.log
            echo "::error::Authenticated gateway did not start correctly."
            exit 1
          fi
          echo "Gateway is running and rejects unauthenticated requests."

      - name: Install Cloudflare Tunnel
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Publish temporary secure endpoint
        run: |
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 >/tmp/cloudflared.log 2>&1 &
          for i in $(seq 1 90); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "${URL:-}" ]; then
            cat /tmp/cloudflared.log
            echo "::error::Could not obtain a Cloudflare temporary tunnel URL."
            exit 1
          fi
          echo "SKALES_BASE_URL=$URL/v1" >> "$GITHUB_ENV"
          {
            echo "## Temporary Skales / Ollama connection"
            echo ""
            echo "- **Base URL:** `$URL/v1`"
            echo "- **Protocol:** OpenAI Chat Completions"
            echo "- **Model:** `llama3.2:1b`"
            echo "- **API key:** Use the same value stored in the repository secret `OLLAMA_API_KEY`. It is intentionally not printed in logs."
            echo "- **Session:** Available only while this workflow is running; cancel this workflow to stop it."
            echo ""
            echo "Keep this URL private. The gateway requires the API key."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Temporary endpoint is ready. URL is recorded in the workflow summary."

      - name: Keep Ollama available for Skales
        run: |
          echo "Ollama is ready. Keep this workflow running while using Skales."
          sleep 20400
